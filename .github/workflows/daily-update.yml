name: 每日收盘更新

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/daily-update.yml"
  schedule:
    # GitHub Actions 使用 UTC；10:30 UTC = 北京时间 18:30
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 3.11
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 恢复行情缓存
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/output
          key: market-cache-${{ github.run_id }}
          restore-keys: |
            market-cache-

      - name: 安装依赖
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: 更新收盘数据与网站 JSON
        if: github.event_name != 'push'
        run: |
          python main.py daily
          python main.py site

      - name: 提交有效结果
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 更新每日技术筛选结果"
          git pull --rebase
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
