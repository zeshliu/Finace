<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A股隔夜高开候选统计与尾盘观察。">
  <title>隔夜高开候选 · A股技术筛选</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="overnight">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">A</span><span><strong>A股技术筛选</strong><small>隔夜高开候选</small></span></a>
    <nav><a href="oversold.html">超跌反弹</a><a href="overnight.html" class="active">隔夜高开</a></nav>
    <button class="icon-button" id="themeToggle" type="button" aria-label="切换深色模式">◐</button>
  </header>

  <main class="list-shell">
    <section class="page-heading overnight-heading">
      <a class="back-link" href="index.html">← 返回总览</a>
      <div class="heading-row">
        <div><div class="eyebrow">OVERNIGHT GAP WATCH</div><h1>隔夜高开候选</h1><p>仅筛选沪市主板与深市主板；统计“尾盘观察、次日开盘后退出”的历史样本，不直接显示买入建议，默认展示综合评分50分以上。</p></div>
        <div class="score-orbit"><strong id="candidateCount">—</strong><span>只候选</span></div>
      </div>
      <div class="update-line"><span class="live-dot"></span><span id="updateText">正在读取最新数据…</span></div>
    </section>

    <section class="toolbar" aria-label="筛选工具">
      <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="搜索名称或代码" autocomplete="off"></label>
      <label>往期记录<select id="historyDateSelect"><option value="latest">最新数据</option></select></label>
      <label>最低价<input id="minPrice" type="number" min="0" step="0.1" placeholder="0"></label>
      <label>最高价<input id="maxPrice" type="number" min="0" step="0.1" placeholder="40"></label>
      <label>排序<select id="sortSelect"><option value="score-desc">评分从高到低</option><option value="days-desc">上榜天数从高到低</option><option value="price-asc">价格从低到高</option><option value="change-desc">涨幅从高到低</option></select></label>
      <button class="refresh-button" id="refreshButton" type="button">↻ 刷新数据</button>
    </section>

    <section class="results-panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>股票</th><th>上榜天数</th><th>当前价</th><th>涨跌幅</th><th>历史高开率</th><th>平均开盘收益</th><th>低开&gt;1%</th><th>尾盘30分钟</th><th>区间位置</th><th>尾盘评分</th><th>综合评分</th><th>风险提示</th><th>数据时间</th></tr></thead>
          <tbody id="resultTable"></tbody>
        </table>
      </div>
      <div class="card-list" id="resultCards"></div>
      <div class="empty-state" id="emptyState" hidden><span>⌁</span><h2>暂无符合条件的股票</h2><p>盘中数据可能尚未生成，或当前没有达到50分的观察样本。</p></div>
    </section>
  </main>

  <div class="modal" id="detailModal" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-panel"><button class="modal-close" type="button" data-close-modal aria-label="关闭">×</button><div id="detailContent"></div><div id="stockChart" class="stock-chart" aria-label="股票技术图表"></div></article>
  </div>
  <footer><p>隔夜统计不代表未来结果，开盘可能受到消息和市场波动影响；本页面不构成投资建议。</p></footer>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="js/app.js?v=20260727_2"></script>
</body>
</html>
