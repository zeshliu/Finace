site:
  title: "A股技术筛选"
  timezone: "Asia/Shanghai"
  history_retention: 60

data:
  # 220个自然日通常覆盖约145-155个交易日，满足120日图表并留出停牌/节假日缓冲
  history_lookback_days: 220
  chart_days: 120
  overnight_stat_days: 60
  recent_gap_results: 20
  adjust: "qfq"
  max_workers: 8
  request_retries: 1
  retry_seconds: 1
  request_timeout: 8
  spot_sources:
    - sina
    - eastmoney
  history_sources:
    - sina
    - tencent
    - eastmoney
    - baostock
  intraday_sources:
    - sina
    - eastmoney
  # 新浪日线批量访问过快可能触发限制，控制请求启动间隔
  sina_history_interval_seconds: 0.25
  intraday_period_minutes: 5
  intraday_shortlist: 300
  min_spot_rows: 1000
  min_history_coverage: 0.70
  min_intraday_coverage: 0.50

screening:
  allowed_boards:
    - sh_main
    - sz_main
  price_min: 0.0
  price_max: 40.0
  min_listing_trading_days: 0
  min_avg_amount_20: 0
  exclude_st: true
  exclude_suspended: true
  near_limit_ratio:
    main: 0.095
    growth: 0.195
    beijing: 0.295
  max_3d_return: null

oversold:
  score_threshold: 65
  min_conditions: 2
  max_drawdown_20: -0.12
  return_10: -0.08
  kdj_low: 20
  j_low: 0
  rsi6_low: 25
  volume_ratio_min: 1.15
  volume_ratio_max: 2.5

overnight:
  score_threshold: 50
  min_samples: 40
  # 隔夜板块不按当日/近3日涨跌幅、尾盘跌幅或区间位置做硬性排除
  basic_return_filter_enabled: false
  change_filter_enabled: false
  tail_drop_filter_enabled: false
  range_position_filter_enabled: false
  change_min: -0.03
  change_max: 0.05
  max_low_open_probability: 0.35
  tail_drop_limit: -0.02
  min_range_position: 0.45
  long_upper_shadow_ratio: 0.50
  abnormal_volume_ratio: 3.0
