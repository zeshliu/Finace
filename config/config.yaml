site:
  title: "A股技术筛选"
  timezone: "Asia/Shanghai"
  history_retention: 60

data:
  # 220个自然日通常覆盖约145-155个交易日，满足120日图表并留出停牌/节假日缓冲
  history_lookback_days: 220
  etf_history_lookback_days: 260
  chart_days: 120
  adjust: "qfq"
  max_workers: 8
  etf_max_workers: 4
  request_retries: 3
  retry_seconds: 2
  request_timeout: 12
  spot_sources:
    - sina
    - eastmoney
    - tencent
  history_sources:
    - sina
    - tencent
    - eastmoney
    - baostock
  # 新浪日线批量访问过快可能触发限制，控制请求启动间隔
  sina_history_interval_seconds: 0.25
  min_spot_rows: 1000
  min_etf_spot_rows: 1000
  min_history_coverage: 0.70
  min_etf_history_coverage: 0.75

screening:
  allowed_boards:
    - sh_main
    - sz_main
  price_min: 0.0
  price_max: 40.0
  min_listing_trading_days: 0
  min_avg_amount_20: 0
  exclude_st: true
  exclude_suspended: true
  near_limit_ratio:
    main: 0.095
    growth: 0.195
    beijing: 0.295
  max_3d_return: null

oversold:
  score_threshold: 65
  min_conditions: 2
  max_drawdown_20: -0.12
  return_10: -0.08
  kdj_low: 20
  j_low: 0
  rsi6_low: 25
  volume_ratio_min: 1.15
  volume_ratio_max: 2.5

t0_etf:
  score_threshold: 60
  min_avg_amount_20: 50000000
  min_avg_amplitude_20: 0.8
  min_current_amount: 5000000
  atr_abnormal_multiplier: 2.0
